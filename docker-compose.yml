services:
  api:
    build: .
    ports: ['8080:8080']
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seritracker
      DB_USERNAME: seritracker_user
      DB_PASSWORD: dev_password
      JWT_SECRET: dev-secret-key-minimo-32-caracteres-para-hs256
      JWT_ACCESS_EXPIRATION: 900000
      REFRESH_TOKEN_EXPIRATION_DAYS: 30
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      APP_BASE_URL: http://localhost:4200
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../seritracker-web
    ports: ['4200:80']
    environment:
      API_URL: http://localhost:8080/api/v1
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seritracker
      POSTGRES_USER: seritracker_user
      POSTGRES_PASSWORD: dev_password
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seritracker_user -d seritracker']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
