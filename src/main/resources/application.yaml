spring:
  application:
    name: seritracker-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seritracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

tmdb:
  base-url: https://api.themoviedb.org/3
  token: ${TMDB_TOKEN:}
  image-base-url: https://image.tmdb.org/t/p/w300

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.seritracker: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN