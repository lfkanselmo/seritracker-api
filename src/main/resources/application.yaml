spring:
  application:
    name: seritracker-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seritracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}

mail:
  from: ${MAIL_FROM:no-reply@seritracker.com}

password-reset:
  expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}

refresh-token:
  expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}

login:
  rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}

register:
  rate-limit:
    max-attempts: ${REGISTER_MAX_ATTEMPTS:10}
    window-minutes: ${REGISTER_WINDOW_MINUTES:60}

forgot-password:
  rate-limit:
    max-attempts: ${FORGOT_PASSWORD_MAX_ATTEMPTS:5}
    window-minutes: ${FORGOT_PASSWORD_WINDOW_MINUTES:60}

tmdb:
  base-url: https://api.themoviedb.org/3
  token: ${TMDB_TOKEN:}
  image-base-url: https://image.tmdb.org/t/p/w300

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}

logging:
  level:
    com.seritracker: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN